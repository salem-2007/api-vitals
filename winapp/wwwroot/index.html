<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型智商检测 · IQ Bench</title>
<link rel="icon" href="app-icon-256.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a4 4 0 0 0-4 4v1a3 3 0 0 0-2 5.2A3.5 3.5 0 0 0 7 18.5V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1.5a3.5 3.5 0 0 0 1-6.3A3 3 0 0 0 16 7V6a4 4 0 0 0-4-4Z"/>
        <path d="M9 11h6M9 15h6"/>
      </svg>
    </span>
    <span class="brand-name">IQ BENCH</span>
    <span class="brand-sub">模型智商检测</span>
  </div>
  <div class="topbar-stats" id="topStats"></div>
  <div class="topbar-actions">
    <button class="btn ghost icon" id="btnRun" title="开始检测">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <span>开始检测</span>
    </button>
    <button class="btn danger icon" id="btnStop" disabled title="停止">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      <span>停止</span>
    </button>
    <button class="btn icon" id="btnShare" title="生成分享报告">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span>分享</span>
    </button>
    <button class="btn ghost icon" id="themeToggle" title="切换主题">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button class="btn ghost icon" id="btnGithub" title="GitHub 仓库 · 点星支持">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>GitHub</span>
    </button>
  </div>
</header>

<main class="layout">

  <!-- ===== 左栏：端点 / 参数 / 题库 ===== -->
  <aside class="sidebar">
    <div class="side-block">
      <div class="side-head"><span>测试参数</span></div>
      <div class="side-body">
        <label class="mini-field"><span>答题并发</span><input id="cfgConc" type="number" min="1" max="16" step="1"></label>
        <label class="mini-field"><span>超时(秒)</span><input id="cfgTimeout" type="number" min="10" max="600" step="10"></label>
        <label class="mini-field"><span>最大 Tokens</span><input id="cfgMaxTok" type="number" min="256" max="32768" step="256"></label>
        <label class="mini-field"><span>失败重试</span><input id="cfgRetries" type="number" min="0" max="5" step="1"></label>
        <label class="mini-field"><span>思考等级</span><select id="cfgThinking">
          <option value="off">关（默认）</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
        </select></label>
        <label class="chk"><input type="checkbox" id="cfgJudge" checked><span>启用视觉裁判（SVG 题）</span></label>
        <label class="chk"><input type="checkbox" id="cfgSvgOn" checked><span>测试 SVG 动画题</span></label>
        <label class="chk"><input type="checkbox" id="cfgProbeOn" checked><span>运行指纹探针（7 层）</span></label>
      </div>
    </div>

    <div class="side-block">
      <div class="side-head"><span>裁判模型</span><span class="hint-inline" id="judgeLabel">跟随被测模型</span></div>
      <div class="side-body">
        <select id="cfgJudgeModel" class="select"><option value="">跟随被测模型</option></select>
      </div>
    </div>

    <div class="side-block grow">
      <div class="side-head">
        <span>端点</span>
        <span class="row-actions">
          <button class="btn tiny" id="btnAddProv">+ 添加</button>
          <button class="btn tiny" id="btnFetchProv">拉模型</button>
        </span>
      </div>
      <div class="providers" id="providers"></div>
    </div>

    <div class="side-block">
      <div class="side-head"><span>题库</span><span class="hint-inline" id="bankCount"></span></div>
      <div class="side-body">
        <label class="chk"><input type="checkbox" id="selAllQ" checked><span>学科推理题（全选）</span></label>
        <div class="qlist" id="qList"></div>
      </div>
    </div>

    <div class="side-block">
      <div class="side-head"><span>项目</span><span class="hint-inline" id="verShort">v0.3.0</span></div>
      <div class="side-body">
        <div class="sub" style="margin-bottom:6px">开源 · MIT · 模型智商检测 IQ Bench</div>
        <div class="btn-row">
          <button class="btn tiny primary" id="btnStar">★ Star 本项目</button>
          <button class="btn tiny" id="btnRepo">GitHub 仓库</button>
          <button class="btn tiny" id="btnIssue">反馈 Issue</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <section class="stage">
    <nav class="tabs" id="tabs">
      <button data-tab="monitor" class="active">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>执行记录
      </button>
      <button data-tab="results">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V5M4 19h16M8 19v-6M12 19V8M16 19v-9"/></svg>成绩单
      </button>
      <button data-tab="gallery">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-2-2-6 6"/></svg>SVG 画廊
      </button>
      <button data-tab="bank">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 0-2 2Z"/><path d="M4 5v14"/></svg>题库
      </button>
      <button data-tab="forensics">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>指纹鉴定
      </button>
    </nav>

    <div class="views">
      <div class="view" id="view-monitor">
        <div class="split">
          <!-- 左：执行记录时间轴 -->
          <div class="panel">
            <div class="panel-head">
              <span>完整执行记录</span>
              <label class="chk tight"><input type="checkbox" id="followLog" checked><span>跟随新内容</span></label>
            </div>
            <div class="timeline" id="timeline"></div>
          </div>
          <!-- 右：生成文件 / 答题记录（可上下翻看） -->
          <div class="panel">
            <div class="panel-head">
              <span class="subtabs">
                <button class="subtab active" data-sub="gen">生成文件</button>
                <button class="subtab" data-sub="hist">答题记录</button>
              </span>
              <span class="hint-inline" id="genHint">模型写入后自动预览</span>
            </div>
            <div class="genbox" id="genbox"></div>
            <div class="histbox hidden" id="histbox"></div>
          </div>
        </div>
      </div>

      <div class="view hidden" id="view-results"></div>
      <div class="view hidden" id="view-gallery"></div>
      <div class="view hidden" id="view-bank"></div>
      <div class="view hidden" id="view-forensics"></div>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span class="run" id="statusText">就绪</span>
  <span id="progressText"></span>
  <span class="ver" id="verText">v0.3.0</span>
</footer>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script type="module" src="app.js"></script>
</body>
</html>
