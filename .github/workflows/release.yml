name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $num = $tag -replace '^v', ''
          "tag=$tag"   >> $env:GITHUB_OUTPUT
          "num=$num"   >> $env:GITHUB_OUTPUT

      - name: 发布单文件 exe
        working-directory: winapp
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.num }} `
            -o dist

      - name: 校验产物
        working-directory: winapp
        shell: pwsh
        run: |
          $exe = Get-Item "dist/IQBench.exe"
          if ($exe.Length -lt 1MB) { throw "exe 体积异常：$($exe.Length) bytes" }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "IQBench.exe  $([math]::Round($exe.Length/1MB,2)) MB  SHA256=$sha"
          "$sha  IQBench.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: 创建 Release 并附上 exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            ## 下载

            - **IQBench.exe** — Windows 单文件客户端，需要 .NET 10 桌面运行时
              （未安装可先装 [.NET Desktop Runtime 10](https://dotnet.microsoft.com/download/dotnet/10.0)）

            双击运行即可，无需解压。前端资源（含图标与 ModelTrace 数值指纹库）已内嵌。

            ## 校验

            见附件 `SHA256SUMS.txt`。

            ```powershell
            Get-FileHash .\IQBench.exe -Algorithm SHA256
            ```

            ## 首次使用

            1. 左侧「+ 添加端点」，填 BaseURL 与 API Key（只写域名会自动补 `/v1`）
            2. 点「拉模型」，勾选要测的模型（不勾 = 自动取前 2 个）
            3. 侧栏确认测试项：学科题逐题勾选、`测试 SVG 动画题`、`运行指纹探针`
            4. 点右上角「开始检测」；跑完看「成绩单」「SVG 画廊」「指纹鉴定」
            5. 「分享」一键生成报告；「答题记录」里可用 ← → 逐条翻看

            ## 功能

            - 22 道学科推理题（本地自动判分，支持 AI 复核 / 人工改判）
            - 8 道 SVG 动画生成题（AI 视觉裁判按维度打分）
            - 7 层 20 项模型指纹探针（含 ModelTrace 数值指纹归因，鉴别套壳/降智）
            - 思考等级支持（reasoning_effort / thinking budget / thinkingConfig）
            - 报告与导出均不含 API Key
          files: |
            winapp/dist/IQBench.exe
            winapp/dist/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
